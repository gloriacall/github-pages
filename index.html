<!DOCTYPE html>
<html>
<head>
  <title>Warehouse Check-In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h2>Warehouse Entry Check-In</h2>
  <p id="warehouse-name"></p>
  <form id="checkin-form">
    <label for="email">Email:</label><br>
    <input type="email" id="email" required><br><br>
    <button type="submit">Submit</button>
  </form>
  <p id="status"></p>

  <script>
    const form = document.getElementById('checkin-form');
    const warehouse = new URLSearchParams(window.location.search).get('warehouse');
    document.getElementById('warehouse-name').textContent = 'Warehouse: ' + (warehouse || 'Unknown');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const data = {
          email,
          warehouse,
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        };

        const response = await fetch('https://script.google.com/macros/s/AKfycbwB1wMtDAL-TbKSxV1hcJqBQdRA_A5IWgSmOAFeHrXrs0mvMTDmBKEwlXrVvxpVwBwC/exec', {
          method: 'POST',
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById('status').textContent = "Check-in successful!";
          form.reset();
        } else {
          document.getElementById('status').textContent = "Error submitting data.";
        }
      });
    });
  </script>
</body>
</html>
